{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<h1>Search</h1>
<form hx-get="{% url 'search:search' %}" hx-target="#search-results" hx-indicator="#search-loading" hx-push-url="true">
    <input type="text" name="q" value="{{ query|default:'' }}"
           placeholder="Ask a question, e.g. Who is the CEO of Tesla?"
           minlength="3" maxlength="500" required>
    <button type="submit">Search</button>
    <span id="search-loading" class="htmx-indicator">Searching…</span>
</form>
<div id="search-results">
    {% include "_search_results.html" %}
</div>
{% endblock %}
